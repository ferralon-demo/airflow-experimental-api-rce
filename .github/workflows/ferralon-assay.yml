# Ferralon Assay
#
# This file is the entire Ferralon footprint in this repository: one GitHub Actions
# workflow that runs a free, deterministic dependency-advisory scan in this repository's
# own runner, via the ferralon-ai/ferralon-assay Action, followed here at the moving
# `@v0.3` minor alias (patch releases land with no per-patch churn; the scanner bytes
# still stay exact via the alias leaf's `scanner-version` default — exact-pin sha
# verification is an opt-in `scanner-sha256` input, not the default). Nothing else is
# committed here, and the scan itself never runs on Ferralon's infrastructure — it runs on
# this workflow's own token, in this repository's own runner.
#
# FIXTURE LAYOUT STANDARD (pipeline-test 1.3, 2026-09-22). `baseline` (and the reference
# patch `fix`) are GOLDEN: never scanned, never the default branch, protected per repo in the
# backend. `main` is the default branch, the only scanned branch, and the disposable fire
# target — reset from `baseline` with `.demo/prep-demo.sh`. Before this change `baseline` was
# the default branch and every push was scanned, so real prod scans ran on refs/heads/baseline
# and a fix-PR would have targeted it. GitHub matches the push filter against the copy of this
# file ON THE PUSHED BRANCH, so `baseline`'s copy must name `main` too. The StateStore is now
# persisted on the default branch only (it was unconditional before).
#
# Removing Ferralon: this file removes itself when the Ferralon App is uninstalled;
# deleting it manually is also safe. If you would rather remove it yourself right now: delete
# this file (a direct commit or a PR both work) and, optionally,
# `git push origin --delete refs/tegron/state`.

name: Ferralon Assay

on:
  pull_request:
  push:
    # The disposable default branch only (see FIXTURE LAYOUT STANDARD above). branches:
    # cannot use a default_branch expression, so the name is hardcoded.
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, off-peak (03:17 UTC)
  repository_dispatch:
    types: [ferralon-advisory-rescan]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  assess:
    name: Ferralon Assay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ferralon-ai/ferralon-assay@v0.3
        with:
          target: .
          ingest-url: https://api.ferralon.com/ingest
          # Persist the durable StateStore ref only on the default branch. A PR or
          # non-default-branch run stays stateless and never overwrites the baseline.
          state-repo: ${{ github.ref_name == github.event.repository.default_branch && github.repository || '' }}
          # Link this repo's runs to the Ferralon console: a canonical-ref (main) run pushes its
          # report to the run-snapshot sink (report_runs). The auto-prove worker enumerates
          # fireable runs ONLY from report_runs, so an unlinked scan is invisible to the fire plane.
          # (ingest-url above is only an endpoint OVERRIDE; it enables nothing without this.)
          link-to-console: "true"
          # STOPGAP (F28, 2026-09-22): the pinned release appears to carry no baked run-snapshot
          # endpoint, so a linked run resolves an empty runs URL and silently pushes nothing.
          # Override it explicitly until the release bakes ASSAY_RUNS_URL; then delete this line.
          runs-url: https://api.ferralon.com/runs
          state-ref: refs/tegron/state
          advisory-corpus-repo: ferralon-ai/vulnerability-corpus
          advisory-corpus-ref: main
          advisory-corpus-policy: published-24h
          # Stopgap: this demo's planted CVE-2020-13927 is a house canary, so it never
          # enters the Python work set on a default scan. Opt in until a synthetic CVE
          # replaces it.
          include-house-canaries: true
